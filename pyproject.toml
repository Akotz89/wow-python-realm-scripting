[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "playerbots-realm-scripts"
version = "0.1.0"
description = "Governed Python scripting workspace for the Playerbots realm"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
mypy_path = "stubs"
files = ["src", "tests", "devtools", "bootstrap"]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 120
src = ["src", "tests", "bootstrap", "devtools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "UP"]
